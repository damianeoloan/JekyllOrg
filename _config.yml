# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: JekyllOrg
description: a free Jekyll theme for organizations and non-profits
baseurl: "/JekyllOrg" # the subpath of your site, e.g. /blog
url: "https://damianeoloan.github.io" # the base hostname & protocol for your site

# Profiles
facebook_username: randomexample
github_username: randomexample
googleplus_username: randomexample
instagram_username: randomexample
linkedin_username: randomexample
periscope_username: randomexample
reddit_username: u/randomexample
twitter_username: randomexample
youtube_username: user/randomexample
email: hello@jekyllorg.com

# API keys
# Left blank on purpose so the key is never committed - without it the map
# sections fall back to a placeholder message instead of failing (see
# pages/about.html and _layouts/event.html).
# To use a real key:
#   - Locally: create a gitignored _config_local.yml containing
#     `api_keys: { google: "your-key" }` and run
#     `jekyll serve --config _config.yml,_config_local.yml`
#     (later --config files override earlier ones).
#   - In CI/deployment: Jekyll doesn't read environment variables directly,
#     and GitHub Pages' automatic build doesn't accept extra --config files,
#     so store the key as a build secret (e.g. a GitHub Actions repository
#     secret) and have the workflow substitute it into this file, or into a
#     generated _config_local.yml as above, before running `jekyll build`.
api_keys:
  google: ""

# Build settings
markdown: kramdown

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-mentions

# Pagination
paginate: 10
paginate_path: "/blog/page:num/"

# Blog / news url
permalink: /news/:title/

# Mentions
jekyll-mentions: https://twitter.com

# Collections
collections:
  services:
    title: Services
    featured-image:
    permalink: /services/:path
    output: true
  issues:
    title: Issues
    featured-image:
    permalink: /issues/:path
    output: true
  events:
    title: Events
    featured-image:
    permalink: /events/:path
    output: true

# Prose
prose:
  siteurl: 'https://damianeoloan.github.io/jekyllorg'
  media: 'images'
  ignore:
    - /_layouts
    - /_includes
    - /_sass
    - /css
    - /_site
    - Gemfile
    - Gemfile.lock
    - feed.xml
    - /.sass-cache
    - README.md
  metadata:
    /_posts:
      - name: "layout"
        field:
          element: "hidden"
          value: "post"
      - name: "title"
        field:
          element: "textarea"
          placeholder: "Add your post title here"
    /_services:
      - name: "layout"
        field:
          element: "hidden"
          value: "service"
      - name: "title"
        field:
          element: "textarea"
          placeholder: "Add your service title here"
      - name: "description"
        field:
          element: "textarea"
          placeholder: "Add a short description of your service here"
      - name: "related"
        field:
          element: "textarea"
          placeholder: "Add the titles of related services here"
    /_issues:
      - name: "layout"
        field:
          element: "hidden"
          value: "issue"
      - name: "title"
        field:
          element: "textarea"
          placeholder: "Add a title for the issue you address here"
      - name: "description"
        field:
          element: "textarea"
          placeholder: "Add a short description of how you address the issue here"
      - name: "related"
        field:
          element: "textarea"
          placeholder: "Add the titles of related issues here"
    /_events:
      - name: "layout"
        field:
          element: "hidden"
          value: "event"
      - name: "title"
        field:
          element: "textarea"
          placeholder: "Add a title for your event here"
      - name: "description"
        field:
          element: "textarea"
          placeholder: "Add a short description of your event here"
      - name: "start-date"
        field:
          element: "textarea"
          placeholder: "Add the event date / time in the format YYYY-MM-DD HH:MM"
      - name: "end-date"
        field:
          element: "textarea"
          placeholder: "You can optionally define an end date / time  for your event in the format YYYY-MM-DD HH:MM"
      - name: "name"
        field:
          element: "textarea"
          placeholder: "Street address, for display purposes only"
      - name: "latitude"
        field:
          element: "textarea"
          placeholder: "The latitude (usually first) value of the location"
      - name: "longitude"
        field:
          element: "textarea"
          placeholder: "The longitude (usually second) value of the location"
